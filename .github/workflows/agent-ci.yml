name: Agent CI & Statutory Regression Gates

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  app-quality-gate:
    name: TypeScript Types & Outreach QA Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Node Dependencies
        run: npm ci

      - name: TypeScript Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Production Auth & JWT Validation QA (5/5 tests)
        run: npm run qa:auth

      - name: Outreach State Machine QA (24/24 tests)
        run: npm run qa:outreach

      - name: Multi-Agent Orchestrator QA (4/4 tests)
        run: npm run qa:orchestrator

  redteam-compliance-gate:
    name: LangSmith Adversarial Red-Team Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install langsmith fastembed langchain-core python-dotenv

      - name: Execute Red-Teaming Benchmark (100% Scorecard Required)
        env:
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_ENDPOINT: "https://eu.api.smith.langchain.com"
          LANGSMITH_PROJECT: "ctx-ci"
        run: |
          python RAG/evaluate_redteam.py --target perimeter
